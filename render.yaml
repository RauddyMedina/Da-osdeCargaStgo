services:
  - type: web
    name: declaracion-danos
    env: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        sync: false
      - key: MIN_FOTOS_POR_CARGA
        value: "1"
      - key: OUTLOOK_EMAIL
        sync: false
      - key: OUTLOOK_PASSWORD
        sync: false
      - key: DESTINATARIOS_DANOS
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: UPLOAD_TOKEN
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1

  - type: cron
    name: recordatorio-cargas-pendientes
    env: python
    schedule: "0 22 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/send_reminder_cargas.py
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: OUTLOOK_EMAIL
        sync: false
      - key: OUTLOOK_PASSWORD
        sync: false
      - key: SMTP_SERVER
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: DESTINATARIOS_DANOS
        sync: false

  - type: cron
    name: sync-cargas-imap
    env: python
    schedule: "0 12-23 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/sync_cargas_imap.py
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: OUTLOOK_EMAIL
        sync: false
      - key: OUTLOOK_PASSWORD
        sync: false
      - key: IMAP_SERVER
        value: outlook.office365.com
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_FOLDER
        value: EasyGo
      - key: DIAS_VENTANA
        value: "7"
